<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Categoría</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/navAlquiler.css}"/>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/mensaje.css">
</head>
<body>
    <!-- NavBar -->
    <div th:replace="~{fragmentos/navCategoria :: nav}"></div>

    <div class="container" style="margin-top: 100px;">
        
        <!-- Mensajes de éxito/error -->
        <div th:replace="~{fragmentos/mensaje :: div}"></div>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5>Nueva Categoría</h5>
            </div>
            <div class="card-body">
                <form action="/categoria/registro" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" class="form-control" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Guardar Categoría</button>
                </form>
            </div>
        </div>

        <!-- LISTADO DE CATEGORÍAS -->
        <div class="card">
            <div class="card-header bg-secondary text-white">
                <h5>Categorías Registradas</h5>
            </div>
            <div class="card-body">
                
                <!-- Mensaje si no hay categorías -->
                <div th:if="${categorias == null or categorias.isEmpty()}" class="alert alert-warning">
                    ⚠️ No hay categorías cargadas
                </div>

                <!-- Tabla de categorías -->
                <div th:if="${categorias != null and !categorias.isEmpty()}">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categorias}">
                                <td th:text="${cat.idCategoria}"></td>
                                
                                <!-- Modo normal: mostrar datos -->
                                <td>
                                    <span th:id="'nombre-' + ${cat.idCategoria}" th:text="${cat.nombre}"></span>
                                    <input type="text" th:id="'input-nombre-' + ${cat.idCategoria}" 
                                           th:value="${cat.nombre}" class="form-control d-none">
                                </td>
                                <td>
                                    <span th:id="'desc-' + ${cat.idCategoria}" th:text="${cat.descripcion}"></span>
                                    <textarea th:id="'input-desc-' + ${cat.idCategoria}" 
                                              class="form-control d-none" rows="1" 
                                              th:text="${cat.descripcion}"></textarea>
                                </td>
                                
                                <td>
                                    <!-- Botón Editar -->
                                    <button type="button" class="btn btn-warning btn-sm" 
                                            th:id="'btn-editar-' + ${cat.idCategoria}"
                                            th:onclick="'editarCategoria(' + ${cat.idCategoria} + ')'">
                                        ✏️ Editar
                                    </button>
                                    
                                    <!-- Formulario oculto para guardar -->
                                    <form th:id="'form-' + ${cat.idCategoria}" 
                                          action="/categoria/modificar" 
                                          method="POST" 
                                          class="d-none d-inline">
                                        <input type="hidden" name="id" th:value="${cat.idCategoria}">
                                        <button type="submit" class="btn btn-success btn-sm">
                                            ✅ Guardar
                                        </button>
                                        <button type="button" class="btn btn-secondary btn-sm"
                                                th:onclick="'cancelarEdicion(' + ${cat.idCategoria} + ')'">
                                            ❌ Cancelar
                                        </button>
                                    </form>
                                    
                                    <!-- Botón Eliminar (opcional) -->
                                    <form action="/categoria/eliminar" method="POST" class="d-inline ms-2"
                                          th:action="@{/categoria/eliminar/{id}(id=${cat.idCategoria})}"
                                          onsubmit="return confirm('¿Seguro que deseas eliminar esta categoría?')">
                                        <button type="submit" class="btn btn-danger btn-sm">
                                            🗑️ Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript para edición inline -->
    <script>
        function editarCategoria(id) {
            // Ocultar spans y mostrar inputs
            document.getElementById('nombre-' + id).classList.add('d-none');
            document.getElementById('desc-' + id).classList.add('d-none');
            document.getElementById('input-nombre-' + id).classList.remove('d-none');
            document.getElementById('input-desc-' + id).classList.remove('d-none');
            
            // Ocultar botón editar y mostrar formulario
            document.getElementById('btn-editar-' + id).classList.add('d-none');
            document.getElementById('form-' + id).classList.remove('d-none');
            
            // Agregar los valores al formulario
            const form = document.getElementById('form-' + id);
            const nombreInput = document.createElement('input');
            nombreInput.type = 'hidden';
            nombreInput.name = 'nombre';
            nombreInput.value = document.getElementById('input-nombre-' + id).value;
            form.appendChild(nombreInput);
            
            const descInput = document.createElement('input');
            descInput.type = 'hidden';
            descInput.name = 'descripcion';
            descInput.value = document.getElementById('input-desc-' + id).value;
            form.appendChild(descInput);
            
            // Actualizar valores al cambiar
            document.getElementById('input-nombre-' + id).addEventListener('input', function() {
                nombreInput.value = this.value;
            });
            document.getElementById('input-desc-' + id).addEventListener('input', function() {
                descInput.value = this.value;
            });
        }
        
        function cancelarEdicion(id) {
            location.reload();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
