<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visita Registrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/agendar-visita.css}">
    <link rel="stylesheet" href="/css/global.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🏠 Gestor Inmobiliario</a>
        </div>
    </nav>

    <div class="container text-center mt-5" style="padding-bottom: 100px; padding-top: 50px;">
        <h2 class="mb-4">Registro Exitoso</h2>

        <div th:if="${mensajeExito}" class="alert alert-success mt-3" role="alert" th:text="${mensajeExito}">
            ¡Visita registrada con éxito!
        </div>
        
        <div th:unless="${mensajeExito}" class="alert alert-info mt-3" role="alert">
            La operación se completó.
        </div>

        <div class="mt-4">
            <a th:href="@{/agendar-visitas}" class="btn btn-primary">
                Agendar otra visita
            </a>
            <a th:href="@{/index}" class="btn btn-secondary ms-2">
                Volver al Inicio
            </a>
        </div>
    </div>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2024 Gestor Inmobiliario. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
