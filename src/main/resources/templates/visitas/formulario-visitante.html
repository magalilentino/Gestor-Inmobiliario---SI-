<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Visita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/agendar-visita.css}">
    <link rel="stylesheet" href="/css/global.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🏠 Gestor Inmobiliario</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Completar Datos del Visitante</h2>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Detalles de la Visita</h5>
                    </div>
                    <div class="card-body">
                        <p><strong>Propiedad:</strong>
                            <span th:text="${horario.propiedad.ubicacion}"></span>
                            (ID: <span th:text="${horario.propiedad.idPropiedad}"></span>)
                        </p>
                        <p><strong>Fecha:</strong>
                            <span th:text="${#temporals.format(horario.fecha, 'dd/MM/yyyy')}"></span>
                        </p>
                        <p><strong>Hora:</strong>
                            <span
                                th:text="${#temporals.format(horario.horaIni, 'HH:mm')} + ' - ' + ${#temporals.format(horario.horaFin, 'HH:mm')} + ' hs'"></span>
                        </p>
                    </div>
                </div>

                <form th:action="@{/visitas/reservar}" method="post">

                    <input type="hidden" name="idHorario" th:value="${horario.idHorario}" />

                    <div class="mb-3">
                        <label for="nombreVisitante" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombreVisitante" name="nombreVisitante" required>
                    </div>
                    <div class="mb-3">
                        <label for="apellidoVisitante" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellidoVisitante" name="apellidoVisitante" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefonoVisitante" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="telefonoVisitante" name="telefonoVisitante" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="emailVisitante" class="form-label">Email</label>
                        <input type="email" class="form-control" id="emailVisitante" name="emailVisitante" required>
                    </div>
                    <div class="text-center mt-4">
                        <a th:href="@{/agendar-visitas}" class="btn btn-secondary me-3">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Confirmar Visita</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2024 Gestor Inmobiliario. Todos los derechos reservados.</p>
            <p class="text-muted">Desarrollado con Spring Boot y Bootstrap</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
